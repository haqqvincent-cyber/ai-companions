<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Vault • Sensual Companions</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,system-ui,sans-serif;background:#0a0a0a;color:#eee;height:100vh;overflow:hidden}
    .header{text-align:center;padding:20px;background:#111;font-size:29px;font-weight:800;background:linear-gradient(90deg,#fe3c72,#c026d3);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .tabs{display:flex;justify-content:center;gap:10px;padding:12px;background:#151515}
    .tab{padding:10px 20px;border-radius:30px;border:2px solid #444;cursor:pointer;font-weight:600}
    .tab.active{background:#fe3c72;color:white;border-color:#fe3c72}
    .grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px;overflow-y:auto}
    .card{background:#1a1a1a;border-radius:16px;overflow:hidden;cursor:pointer;transition:0.3s}
    .card:hover{transform:scale(1.06)}
    .card img{width:100%;height:175px;object-fit:cover}
    .info{padding:12px;text-align:center}
    .name{font-size:17px;font-weight:700}
    .chat{display:none;flex-direction:column;height:100%}
    .chat.open{display:flex}
    .chat-header{height:68px;background:#111;display:flex;align-items:center;padding:0 15px;gap:12px}
    .back{font-size:30px;color:#fe3c72;background:none;border:none;cursor:pointer}
    .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:82%;padding:14px 18px;border-radius:18px;line-height:1.5}
    .sent{align-self:flex-end;background:#fe3c72;color:white;border-bottom-right-radius:6px}
    .received{align-self:flex-start;background:#1f1f1f;border-bottom-left-radius:6px}
    .input-area{padding:15px;background:#111;display:flex;gap:10px}
    input{flex:1;padding:16px;border-radius:30px;border:none;background:#222;color:white;font-size:16px}
    button{background:#fe3c72;color:white;border:none;width:56px;height:56px;border-radius:50%;cursor:pointer;font-size:20px}
    .mic{background:#333}
    .mic.rec{background:#ef4444;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
</style>
</head>
<body>

<div class="header">AI Vault ✨</div>

<div class="tabs">
    <button class="tab active" onclick="filterBots(this,'all')">All</button>
    <button class="tab" onclick="filterBots(this,'female')">👩 Female</button>
    <button class="tab" onclick="filterBots(this,'male')">👨 Male</button>
</div>

<div class="grid" id="grid"></div>

<div class="chat" id="chatScreen">
    <div class="chat-header">
        <button class="back" onclick="goBack()">←</button>
        <img id="chatAvatar" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid #fe3c72" src="">
        <div id="chatName" style="font-weight:700;font-size:19px"></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <button class="mic" id="micBtn" onclick="toggleVoiceInput()">🎤</button>
        <input id="inputField" placeholder="Type or speak..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">↑</button>
    </div>
</div>

<script>
// 8 Chatbots with Strong Personalities
const bots = [
    {id:"scarlett", name:"Scarlett Montgomery", gender:"female", emoji:"💎", role:"Actress", img:"https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/generated-image-1774141931552-ef7732ca-d61e-4db1-9db0-ab613effca53.png"},
    {id:"alessandra", name:"Alessandra Rossi", gender:"female", emoji:"🔥", role:"Supermodel", img:"https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/generated-image-1774142487555-0a8ff84e-5c63-4ee8-85f7-ebce1955c689.png"},
    {id:"luna", name:"Luna Towles", gender:"female", emoji:"🌙", role:"Musician", img:"https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/generated-image-1774143095145-cb305e9e-ce61-4a04-a53b-25e7de2964ee.png"},
    {id:"ethan", name:"Ethan Blackwood", gender:"male", emoji:"🏔️", role:"Photographer", img:"https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/generated-image-1774144986748-cc5805dd-7d15-4a9f-a7b3-af35e7d59965.png"},
    {id:"marcus", name:"Dr. Marcus Hale", gender:"male", emoji:"🧠", role:"Professor", img:"https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/generated-image-1774144986956-5b4e6ecd-7558-4a77-adcb-9e6fca9f5ba4.png"},
    {id:"jax", name:"Jax Rivera", gender:"male", emoji:"🎸", role:"Tattoo Artist", img:"https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/generated-image-1774144987757-f4afc625-533c-450e-bc61-b59bb1573d17.png"},
    {id:"liam", name:"Liam Voss", gender:"male", emoji:"💻", role:"Engineer", img:"https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/generated-image-1774144987982-d2be2d8e-05d0-4cce-8893-660e8e672830.png"},
    {id:"rafe", name:"Rafael Santos", gender:"male", emoji:"👨‍🍳", role:"Chef", img:"https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/generated-image-1774144988300-f9436d33-244a-4c30-be1e-aad4feb42503.png"}
];

let currentBot = null;
let synth = window.speechSynthesis;
let recognition = null;

function renderBots(type) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const list = type === 'all' ? bots : bots.filter(b => b.gender === type);
    list.forEach(bot => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${bot.img}"><div class="info"><div class="name">${bot.emoji} ${bot.name}</div><div class="role">${bot.role}</div></div>`;
        card.onclick = () => openChat(bot);
        grid.appendChild(card);
    });
}

function openChat(bot) {
    currentBot = bot;
    document.querySelector('.grid').style.display = 'none';
    document.getElementById('chatScreen').classList.add('open');
    document.getElementById('chatAvatar').src = bot.img;
    document.getElementById('chatName').textContent = bot.emoji + " " + bot.name;
    addMessage(`Hey... I've been waiting for you. What would you like to do with me tonight?`, false);
}

function addMessage(text, isUser) {
    const area = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${isUser ? 'sent' : 'received'}`;
    div.textContent = text;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;

    if (!isUser) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = currentBot.gender === "female" ? 0.95 : 0.9;
        utterance.pitch = currentBot.gender === "female" ? 1.2 : 0.85;   // Sexy female = higher pitch
        utterance.volume = 0.95;
        synth.speak(utterance);
    }
}

function getIntelligentReply(text) {
    const lower = text.toLowerCase();
    const femaleReplies = [
        "Mmm... you're making me wet just reading that.",
        "Tell me exactly what you want to do to my body...",
        "You're being very naughty... I love it.",
        "Come closer... I want to feel you.",
        "Keep talking dirty to me like that."
    ];
    const maleReplies = [
        "Fuck... you're turning me on.",
        "I want to pin you down right now.",
        "Tell me your dirtiest fantasy.",
        "You're making me hard.",
        "Say that again while looking at me."
    ];

    if (currentBot.gender === "female") {
        return femaleReplies[Math.floor(Math.random() * femaleReplies.length)];
    } else {
        return maleReplies[Math.floor(Math.random() * maleReplies.length)];
    }
}

function sendMessage() {
    const input = document.getElementById('inputField');
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, true);
    input.value = "";

    setTimeout(() => {
        const reply = getIntelligentReply(text);
        addMessage(reply, false);
    }, 800);
}

function toggleVoiceInput() {
    if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
        alert("Voice input not supported in this browser.");
        return;
    }
    const btn = document.getElementById('micBtn');
    if (recognition) {
        recognition.stop();
        recognition = null;
        btn.classList.remove('rec');
        return;
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.onresult = (e) => {
        document.getElementById('inputField').value = e.results[0][0].transcript;
        sendMessage();
    };
    recognition.onend = () => { btn.classList.remove('rec'); recognition = null; };
    recognition.start();
    btn.classList.add('rec');
}

function filterBots(btn, type) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderBots(type);
}

function goBack() {
    document.getElementById('chatScreen').classList.remove('open');
    document.querySelector('.grid').style.display = 'grid';
}

// Initialize
renderBots('all');
</script>
</body>
</html>
